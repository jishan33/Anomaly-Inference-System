apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus

spec:
  replicas: 1
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      securityContext:
        fsGroup: 65536

      serviceAccountName: prometheus

      volumes:
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-data

        - name: prometheus-config
          configMap:
            name: prometheus-config

        - name: vllm-scrape-targets
          secret:
            secretName: anomaly-inference-secret
            items:
              - key: vllm-server-metric-targets.yaml
                path: server-targets.yaml
              - key: vllm-gpu-metric-targets.yaml
                path: gpu-targets.yaml

      containers:
        - name: prometheus
          image: prom/prometheus
          imagePullPolicy: IfNotPresent
          args:
              - --config.file=/etc/prometheus/prometheus.yml
              - --storage.tsdb.path=/prometheus
              - --storage.tsdb.retention.time=30d
              - --storage.tsdb.retention.size=7GB

          volumeMounts:
            - name: prometheus-data
              mountPath: /prometheus

            - name: prometheus-config
              mountPath: /etc/prometheus/
              readOnly: true

            - name: vllm-scrape-targets
              mountPath: /etc/vllm-targets
              readOnly: true
          ports:
            - containerPort: 9090
              protocol: TCP

      restartPolicy: Always
      