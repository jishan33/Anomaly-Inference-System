apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      serviceAccountName: prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config

        - name: vllm-scrape-targets
          secret:
            secretName: anomaly-inference-secret
            items:
              - key: vllm-targets.yaml
                path: targets.yaml

      containers:
        - name: prometheus
          image: prom/prometheus
          imagePullPolicy: IfNotPresent

          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/
              readOnly: true

            - name: vllm-scrape-targets
              mountPath: /etc/vllm-targets
              readOnly: true
          ports:
            - containerPort: 9090
              protocol: TCP

      restartPolicy: Always
      