apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      # Dynamic Pod Discovery for your API and Workers
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          -  action: labelmap
             regex: __meta_kubernetes_pod_label_(.+)
             
          # 1. Only scrape pods that have the annotation: prometheus.io/scrape: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true

          # 2. Allow pods to override the default '/metrics' path using prometheus.io/path: "/custom_path"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)

          # 3. Allow pods to override the target port using prometheus.io/port: "9001"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

          # 4. Clean up the dashboard labels by exposing the real pod name and namespace
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
            
      # Kubelet-embedded cAdvisor metrics
      - job_name: 'kubernetes-cadvisor'
        scheme: https

        kubernetes_sd_configs:
          - role: node

        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token

        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443

          - source_labels: [ __meta_kubernetes_node_name ]
            target_label: __metrics_path__
            regex: (.+)
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

          - source_labels: [ __meta_kubernetes_node_name ]
            target_label: node

          - target_label: cluster
            replacement: docker-desktop

          - target_label: environment
            replacement: local